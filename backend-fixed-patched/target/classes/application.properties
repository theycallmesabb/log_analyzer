server.port=8080

# H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:securelogdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Actuator
management.endpoints.web.exposure.include=health,info

# Logging
logging.level.com.securelog=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN

# JWT
jwt.secret=SecureLog2024VeryLongSecretKeyForJWTTokenGenerationAndValidation
jwt.expiration=86400000

# App
app.name=SecureLog

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=52MB
